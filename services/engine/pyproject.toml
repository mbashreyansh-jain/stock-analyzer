[project]
name = "stockai-engine"
version = "0.1.0"
description = "Data, analytics and scoring engine for the Stock AI research tool"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.32",
]

[project.scripts]
stockai = "stockai.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a running Postgres at DATABASE_URL"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and request bodies as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
