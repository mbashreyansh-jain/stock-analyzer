services:
  db:
    image: timescale/timescaledb:2.17.2-pg17
    container_name: stockai-db
    environment:
      POSTGRES_USER: stockai
      POSTGRES_PASSWORD: stockai
      POSTGRES_DB: stockai
    ports:
      - "5433:5432"
    volumes:
      - stockai-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockai -d stockai"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  stockai-db:
