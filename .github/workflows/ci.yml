name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:2.17.2-pg17
        env:
          POSTGRES_USER: stockai
          POSTGRES_PASSWORD: stockai
          POSTGRES_DB: stockai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stockai -d stockai_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: services/engine
    env:
      STOCKAI_TEST_DATABASE_URL: postgresql://stockai:stockai@localhost:5432/stockai_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run pytest -q
