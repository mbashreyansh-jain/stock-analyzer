<link rel="stylesheet" href="/static/auth.css">
<style>
/* Placeholder until the Watchlist page is designed. Same top bar and app tabs as the Daily picks and Portfolio pages. */
.topbar { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1240px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.topbar-in .sp { flex: 1; }
.page { max-width: 1240px; margin: 0 auto; padding: 18px 20px 70px; display: grid; gap: 16px; }
.apptabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.apptabs span { flex: none; padding: 7px 16px; border-radius: 999px; color: var(--ink-2); font-weight: 500; font-size: 0.94em; }
.apptabs span.on { background: var(--ink); color: #fff; font-weight: 700; }
.soon { background: var(--surface); border: 1.5px dashed var(--line); border-radius: 24px; padding: 40px 24px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.soon h1 { font-size: 1.6em; font-weight: 800; }
.soon p { color: var(--ink-2); max-width: 52ch; }
</style>
<header class="topbar"><div class="topbar-in"><span class="brand"><i aria-hidden="true"></i>Stock AI</span><span class="sp"></span></div></header>
<div class="page">
  <nav class="apptabs" aria-label="App sections"><span>Stocks</span><span>Daily picks</span><span class="on">Watchlist</span><span>Portfolio</span></nav>
  <section class="soon">
    <h1>Watchlist is coming next</h1>
    <p>Stocks you star on Daily picks will show here with their latest signals. This page hasn't been designed yet.</p>
    <a class="btn primary" href="/picks">Go to Daily picks</a>
  </section>
</div>
